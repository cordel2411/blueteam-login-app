<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Sign in</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main><h1>Sign in</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" autocomplete="off">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Username <input name="username" maxlength="64" required></label>
<label>Password <input name="password" type="password" maxlength="128" required></label>
<button>Sign in</button></form></main></body></html>
